name: Unit tests

on:
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev qtbase5-dev-tools cmake

      - name: Configure
        run: cmake -S sfos/harbour-sailreel/tests -B build

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
