name: Build and release Sailfish RPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Must match (or be compatible with) the Sailfish OS version on target
  # devices. Check on-device under Settings > About product. Update this
  # when bumping to a newer Sailfish release.
  SFOS_RELEASE: "5.1.0.11"

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["aarch64", "armv7hl"]
    steps:
      - uses: actions/checkout@v7

      - name: Set RPM version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # RPM Version can't contain a hyphen, so a tag like v0.7.0-rc.1
          # becomes Version 0.7.0, Release 0.rc.1 — the leading "0." makes
          # it sort before the eventual Release: 1 final build.
          if [[ "$TAG_VERSION" == *-* ]]; then
            BASE_VERSION="${TAG_VERSION%%-*}"
            SUFFIX="${TAG_VERSION#*-}"
            RPM_RELEASE="0.${SUFFIX//[^a-zA-Z0-9.]/}"
          else
            BASE_VERSION="$TAG_VERSION"
            RPM_RELEASE="1"
          fi
          sed -i "s/^Version:.*/Version:    ${BASE_VERSION}/" sfos/harbour-sailreel/rpm/harbour-sailreel.spec
          sed -i "s/^Release:.*/Release:    ${RPM_RELEASE}/" sfos/harbour-sailreel/rpm/harbour-sailreel.spec

      - name: Build RPM via Sailfish Platform SDK
        id: build
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          arch: ${{ matrix.arch }}
          release: ${{ env.SFOS_RELEASE }}
          source-dir: "sfos/harbour-sailreel"
          fix-version: false

      - uses: actions/upload-artifact@v7
        with:
          name: harbour-sailreel-rpm-${{ matrix.arch }}
          path: RPMS

  release:
    needs: build-rpm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: harbour-sailreel-rpm-*
          path: RPMS
          merge-multiple: true

      - name: Attach RPMs to release
        uses: softprops/action-gh-release@v3
        with:
          files: RPMS/**/*.rpm
          # Tags like v0.7.0-rc.1 are dev/RC builds for local sideloading —
          # only plain vX.Y.Z tags are candidates for manual promotion to
          # OpenRepos.
          prerelease: ${{ contains(github.ref_name, '-') }}
